        blockage: ["03-23", "03-29"]
        backlog:  ["03-30", "05-24"]
      phase_year_offsets: {pre: 0, blockage: 0, backlog: 0}
      phase_roles: {pre: "pre", blockage: "event", backlog: "post"}
      standardize_to: null          # descriptive only: no composition model
      placebo_years: [2019, 2020]
      pipeline_transition_at_onset: false

# ============================================================================
#  PHASE 4A - multi-event feasibility screening.
#
#  Purpose: data feasibility and identification checks ONLY. No event effects
#  are estimated here. Event dates come from documented external chronology and
#  are frozen before any SAR/AIS result for these areas is inspected.
#
#  The Hormuz specification is NOT touched by this section: primary remains
#  hormuz_core, the narrow AOI remains a pre-specified sensitivity analysis.
# ============================================================================
multievent:
  events:
    suez_2021:
      event_type: "canal_blockage"
      aoi_key: "suez_canal_core"
      event_date: "2021-03-23"
      event_window: ["2021-03-23", "2021-03-29"]
      documented_chronology: >
        Ever Given grounded 2021-03-23 ~07:40 local in the southern single-lane
        section; refloated 2021-03-29; canal reopened 2021-03-29 evening; the
        convoy backlog cleared in the following days. Source: public accident
        chronology (Suez Canal Authority / press reporting), fixed before data
        inspection.
      pre_weeks: 8
      post_weeks: 8
      placebo_years: [2019, 2020]
    red_sea_2023:
      event_type: "regional_shipping_disruption"
      aoi_key: "bab_el_mandeb_core"
      event_date: "2023-12-15"
      event_window: ["2023-12-15", "2024-02-15"]
      documented_chronology: >
        Galaxy Leader hijacked 2023-11-19; attacks on commercial shipping
        escalated through Nov-Dec 2023; major carriers suspended Red Sea
        transits around 2023-12-15; Operation Prosperity Guardian announced
        2023-12-18; sustained Cape of Good Hope rerouting from mid-December 2023
        onward. Source: public event chronology, fixed before data inspection.
      pre_weeks: 8
      post_weeks: 8
      placebo_years: [2021, 2022]
  # Screening thresholds - feasibility only, never significance tests.
  screening:
    min_event_scenes: 4
    min_event_detections: 60
    # Gate on acquisition DAYS inside the event window, not weeks: a 7-day event
    # (Suez 2021) cannot contain three ISO weeks. Weeks are reported but do not
    # gate the classification.
    min_event_acquisition_days: 3
    # Prolonged event phases additionally need independent acquisition weeks, so a
    # multi-month disruption is not judged on a single pass.
    prolonged_phase_days: 28
    min_event_acquisition_weeks_prolonged: 3
    min_median_coverage_fraction: 0.30
    min_placebo_scenes: 4
    strong_requires_same_pipeline: true
    strong_requires_placebo: true
    strong_requires_ais_days: 1

  # ---------------------------------------------------------------------
  # Phase 4A extension: two additional candidate events.
  #
  # Phases are declared as calendar month-day windows so that the event year and
  # every placebo year use the identical calendar days (the same convention as
  # the frozen Hormuz specification).
  #
  # Case roles are fixed here and must not drift:
  #   bab_mandeb_2026  = concurrent spillover case under the same regional crisis
  #                      as Hormuz 2026. NOT an independent validation and NOT a
  #                      control group.
  #   panama_2023      = non-security climate/capacity contrast. NOT a negative
  #                      control.
  # ---------------------------------------------------------------------
  extension_events:
    bab_mandeb_2026:
      case_role: "concurrent_spillover_case"
      case_role_note: >
        Concurrent spillover case under the same regional geopolitical shock as
        Hormuz 2026 and under the same GFW pipev3 -> pipev4 transition. It is not
        an independent validation of Hormuz and must never be called a control
        group.
      disruption_type: "geopolitical_security"
      aoi_key: "bab_el_mandeb_core"
      event_onset: "2026-03-01"
      event_onset_basis: >
        Operational decision by major carriers to pause/reroute Trans-Suez
        sailings through Bab el-Mandeb in response to the escalating regional
        security situation. Externally defined; not derived from SAR/AIS data.
      sar_window: ["2024-01-01", "2026-05-31"]
      sar_window_tag: "w2024_2026"
      primary_screen_end: "2026-05-31"
      event_phase: "acute"
      phases:
        baseline:   ["01-01", "02-27"]
        acute:      ["03-01", "03-27"]
        persistent: ["03-28", "05-31"]
      phase_roles:
        baseline: "pre"
        acute: "event"
        persistent: "post"
      placebo_years: [2024, 2025]
      technical_breaks_in_window:
        - "2026-03-01 GFW pipev3 -> pipev4 (same boundary as Hormuz 2026)"
        - "2026-03-28 GFW SAR ocean-land-mask update"
      # The study onset is exactly the pipeline boundary. Handled the same way as
      # the frozen Hormuz design: within-event effects must be read against the
      # historical placebo, and the pipeline change is not differentially
      # confounded between Hormuz and Bab el-Mandeb because both switch on the
      # same date.
      pipeline_transition_at_onset: true
      # Directly comparable with the frozen Hormuz calendar phases.
      comparable_to_hormuz_calendar: true
    panama_2023:
      case_role: "non_security_contrast"
      case_role_note: >
        Non-security, climate/capacity disruption. It is not a negative control:
        the purpose is to ask whether substantial maritime activity disruption can
        occur without deterioration in AIS observability.
      disruption_type: "climate_capacity_disruption"
      aoi_key: "panama_canal_core"
      event_onset: "2023-11-03"
      event_onset_basis: >
        Onset of the stronger pre-specified transit-restriction regime used for
        this event study (operational start of the tightened drought-driven
        booking/slot restrictions announced at the end of October 2023). This is
        NOT the absolute beginning of the drought crisis: the canal had already
        implemented earlier drought-related restrictions before November 2023.
      sar_window: ["2021-09-01", "2024-04-30"]
      sar_window_tag: null
      event_phase: "restricted"
      phases:
        pre:        ["09-01", "11-02"]
        restricted: ["11-03", "02-29"]
        adaptation: ["03-01", "04-30"]
      # The restricted phase crosses the year boundary, so the adaptation phase
      # belongs to the calendar year *after* the anchor year of each window.
      phase_year_offsets:
        pre: 0
        restricted: 0
        adaptation: 1
      # Expected and verified from the data: the whole window (Sep 2021 - Apr
      # 2024) lies before the 2024-11 pipeline change, so one generation spans
      # every phase. Never assumed - it is read from the detection-file tokens.
      pipeline_transition_at_onset: false
      phase_roles:
        pre: "pre"
        restricted: "event"
        adaptation: "post"
      phase_years_note: >
        The restricted phase crosses the year boundary (Nov 3 -> Feb 29), so each
        phase is anchored to the year in which it starts: pre in year Y,
        restricted from Y-11-03 to Y+1-02-29, adaptation in Y+1.
      placebo_years: [2021, 2022]

