      phases:
        baseline:   ["01-01", "02-27"]
        acute:      ["03-01", "03-27"]
        persistent: ["03-28", "05-31"]
      phase_year_offsets: {baseline: 0, acute: 0, persistent: 0}
      phase_roles: {baseline: "pre", acute: "event", persistent: "post"}
